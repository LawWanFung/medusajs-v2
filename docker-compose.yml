services:
  # # 💥 2. YAML ANCHOR 錨點：所有 App 嘅共通設定 (移除 pnpm-store volume)
  # x-app-base: &APP_BUILD_BASE
  #   working_dir: /app
  #   build:
  #     context: https://github.com/LawWanFung/medusajs-v2.git
  #     # 💥 所有 Apps 嘅 Dockerfile 都會用 Base Builder
  #     dockerfile: Dockerfile 

  medusa:
    # <<: *APP_BUILD_BASE # 引用 Base 設定
    #  working_dir: /app
    build:
      context: https://github.com/LawWanFung/medusajs-v2.git
      dockerfile: packages/medusa/Dockerfile
    container_name: medusa_core
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/medusa-store
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    volumes:
      - .:/server
      - /server/node_modules
    networks:
      - medusa_network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge